<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iran - Country Card | TimeGovern</title>
<meta name="robots" content="noindex,follow">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#164e63 100%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:100%;max-width:340px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:18px;text-align:center}
.flag{font-size:44px;line-height:1;margin-bottom:6px}
.name{font-size:19px;font-weight:900;letter-spacing:-0.02em}
.native{font-size:13px;color:rgba(255,255,255,0.5);margin-top:2px}
.dial{font-size:26px;font-weight:900;color:#67e8f9;font-family:ui-monospace,SFMono-Regular,monospace;margin:10px 0 2px}
.dial-label{font-size:9px;text-transform:uppercase;letter-spacing:0.12em;color:rgba(255,255,255,0.4);margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;text-align:left}
.gi{background:rgba(255,255,255,0.04);border-radius:8px;padding:7px 9px}
.gi .l{font-size:8px;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.4)}
.gi .v{font-size:12px;font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.1)}
.time .l{font-size:8px;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.4)}
.time .v{font-size:17px;font-weight:900;font-family:ui-monospace,SFMono-Regular,monospace;margin-top:3px}
.footer{font-size:10px;color:rgba(255,255,255,0.4);margin-top:10px}
.footer a{color:#67e8f9;text-decoration:none}
.footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
<div class="flag">🇮🇷</div>
<div class="name">Iran</div>
<div class="native">ایران &middot; Persian</div>
<div class="dial">+98</div>
<div class="dial-label">Dial code</div>
<div class="grid">
<div class="gi"><div class="l">ISO 2</div><div class="v">IR</div></div>
<div class="gi"><div class="l">ISO 3</div><div class="v">IRN</div></div>
<div class="gi"><div class="l">Capital</div><div class="v">Tehran</div></div>
<div class="gi"><div class="l">Currency</div><div class="v">IRR IRR</div></div>
</div>
<div class="time"><div class="l">Local time</div><div class="v" id="t">--:--:--</div></div>
<div class="footer">via <a href="https://timegovern.com/country-codes/ir" target="_blank" rel="noopener">TimeGovern</a></div>
</div>
<script>
(function(){
var tz="Asia/Tehran",el=document.getElementById("t");
function tick(){try{el.textContent=new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date())}catch(e){el.textContent="--:--:--"}}
tick();setInterval(tick,1000);
})();
</script>
</body>
</html>
